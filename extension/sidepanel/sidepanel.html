<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font: 13px/1.45 "Segoe UI", sans-serif; margin: 0; background: #12161e; color: #eef2f8; }
      header { padding: 14px 16px; border-bottom: 1px solid #2a3344; }
      h1 { font-size: 14px; margin: 0 0 6px; letter-spacing: 0.12em; color: #e8b86d; }
      .body { padding: 14px 16px; }
      .meta { color: #9aa6b8; margin: 6px 0; }
      .warn { color: #f0c987; }
      .value { color: #eef2f8; }
      .mark { font-size: 14px; font-weight: 600; color: #eef2f8; margin: 6px 0; }
      .url { color: #e8b86d; word-break: break-all; font-size: 12px; }
      button { margin-right: 6px; margin-top: 12px; padding: 8px 10px; }
      button.primary { background: #e8b86d; border: 0; color: #12161e; font-weight: 700; }
      pre { white-space: pre-wrap; font-size: 12px; color: #c9d3e2; }
      h3 { margin: 16px 0 6px; font-size: 11px; letter-spacing: 0.08em; color: #e8b86d; }
      .job { padding: 8px 0; border-bottom: 1px solid #2a3344; }
      .job a { color: #e8b86d; }
      #jobs { max-height: 280px; overflow: auto; }
      a.link { color: #e8b86d; cursor: pointer; }
    </style>
  </head>
  <body>
    <header>
      <h1>JOB BIDER</h1>
      <div id="statusLine">No active job</div>
      <div class="meta" id="biderStatus"></div>
    </header>
    <div class="body">
      <h3>CLIENT</h3>
      <div class="meta" id="clientName">👤 —</div>
      <div class="mark" id="clientIdentity">— 本人確認</div>
      <div class="mark" id="clientRule">— 発注ルール</div>
      <div class="meta" id="clientRecord">募集実績 —</div>
      <div class="meta" id="clientRate">完了率 —</div>
      <h3>URL</h3>
      <div class="url" id="jobUrl">—</div>
      <button id="open" class="primary">Open job</button>
      <button id="prepare">Prepare page</button>
      <button id="skip">SKIP</button>
      <button id="next">NEXT</button>
      <button id="options">Options</button>
      <h3>Description</h3>
      <pre id="desc"></pre>
      <h3>FROM DATABASE</h3>
      <div id="jobs" class="meta">Loading…</div>
    </div>
    <script src="../shared/verify.js"></script>
    <script src="sidepanel.js"></script>
  </body>
</html>
