<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font: 13px/1.45 "Segoe UI", sans-serif; margin: 0; background: #12161e; color: #eef2f8; }
      header { padding: 14px 16px; border-bottom: 1px solid #2a3344; }
      h1 { font-size: 14px; margin: 0 0 6px; letter-spacing: 0.12em; color: #e8b86d; }
      .body { padding: 14px 16px; }
      .meta { color: #9aa6b8; margin: 6px 0; }
      .warn { color: #f0c987; }
      .url { color: #e8b86d; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; }
      .row.focused .url { color: #7ee0a8; }
      button { margin-right: 6px; margin-top: 8px; padding: 7px 9px; font-size: 12px; }
      button.primary { background: #e8b86d; border: 0; color: #12161e; font-weight: 700; }
      button.mini { margin: 0; padding: 1px 6px; font-size: 10px; line-height: 1.3; }
      h3 { margin: 16px 0 6px; font-size: 11px; letter-spacing: 0.08em; color: #e8b86d; }
      #jobs { max-height: 420px; overflow: auto; }
      .row {
        border-bottom: 1px solid #2a3344;
        padding: 5px 0;
      }
      .row.parked { opacity: 0.88; }
      .line1 { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
      .acts { display: flex; align-items: center; gap: 4px; flex: 0 0 auto; }
      .line2, .line3 { color: #9aa6b8; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .tag {
        flex: 0 0 auto;
        font-size: 9px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        padding: 1px 5px;
        border-radius: 3px;
        background: #2a3344;
        color: #c5d0de;
      }
      .tag-queued { background: #243246; color: #9ec5ff; }
      .tag-ready { background: #2a3a24; color: #b7e38d; }
      .tag-skipped { background: #3a3224; color: #f0c987; }
      .tag-closed { background: #3a2428; color: #f0a3a8; }
    </style>
  </head>
  <body>
    <header>
      <h1>JOB BIDER</h1>
      <div id="profileLine" class="meta">Profile · detecting…</div>
      <div id="statusLine">No active jobs</div>
      <div class="meta" id="biderStatus"></div>
    </header>
    <div class="body">
      <div id="slots"></div>
      <h3 id="parkedHead" hidden>SKIPPED / CLOSED</h3>
      <div id="parked"></div>
      <button id="open" class="primary">Fill window</button>
      <button id="prepare">Prepare this tab</button>
      <button id="skip">SKIP</button>
      <button id="next">NEXT</button>
      <button id="options">Options</button>
      <h3>FROM DATABASE</h3>
      <div id="jobs" class="meta">Loading…</div>
    </div>
    <script src="../shared/dates.js"></script>
    <script src="../shared/verify.js"></script>
    <script src="../shared/job-card.js"></script>
    <script src="sidepanel.js"></script>
  </body>
</html>
