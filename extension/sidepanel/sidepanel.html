<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font: 13px/1.45 "Segoe UI", sans-serif; margin: 0; background: #12161e; color: #eef2f8; }
      header { padding: 14px 16px; border-bottom: 1px solid #2a3344; }
      h1 { font-size: 14px; margin: 0 0 6px; letter-spacing: 0.12em; color: #e8b86d; }
      .body { padding: 14px 16px; }
      .meta { color: #9aa6b8; margin: 6px 0; }
      .warn { color: #f0c987; }
      .url { color: #e8b86d; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
      button { margin-right: 6px; margin-top: 8px; padding: 8px 10px; }
      button.primary { background: #e8b86d; border: 0; color: #12161e; font-weight: 700; }
      h3 { margin: 16px 0 6px; font-size: 11px; letter-spacing: 0.08em; color: #e8b86d; }
      #jobs { max-height: 420px; overflow: auto; }
      .row {
        border-bottom: 1px solid #2a3344;
        padding: 6px 0;
      }
      .row.parked { opacity: 0.88; }
      .line1 { display: flex; align-items: center; gap: 8px; }
      .line1 button { margin: 0; flex: 0 0 auto; padding: 4px 8px; }
      .line2 { color: #9aa6b8; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    </style>
  </head>
  <body>
    <header>
      <h1>JOB BIDER</h1>
      <div id="profileLine" class="meta">Profile · detecting…</div>
      <div id="statusLine">No active jobs</div>
      <div class="meta" id="biderStatus"></div>
    </header>
    <div class="body">
      <div id="slots"></div>
      <h3 id="parkedHead" hidden>SKIPPED / CLOSED</h3>
      <div id="parked"></div>
      <button id="open" class="primary">Fill window</button>
      <button id="prepare">Prepare this tab</button>
      <button id="skip">SKIP</button>
      <button id="next">NEXT</button>
      <button id="options">Options</button>
      <h3>FROM DATABASE</h3>
      <div id="jobs" class="meta">Loading…</div>
    </div>
    <script src="../shared/verify.js"></script>
    <script src="../shared/job-card.js"></script>
    <script src="sidepanel.js"></script>
  </body>
</html>
