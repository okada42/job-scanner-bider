<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font: 13px/1.4 sans-serif; width: 320px; margin: 12px; }
      button { width: 100%; margin: 4px 0; padding: 8px; }
      label.toggle { display: flex; align-items: center; gap: 8px; margin: 8px 0; }
      .hint { color: #555; font-size: 11px; margin: 8px 0 12px; }
      .scan { color: #333; font-size: 11px; min-height: 1.4em; }
      h2 { font-size: 11px; letter-spacing: 0.06em; color: #666; margin: 12px 0 6px; }
      #jobs { max-height: 280px; overflow: auto; border-top: 1px solid #ddd; }
      .job { padding: 8px 0; border-bottom: 1px solid #eee; }
      .job a { color: #b45309; text-decoration: none; font-weight: 600; }
      .meta { color: #666; font-size: 11px; }
      .empty { color: #888; font-size: 12px; padding: 8px 0; }
      .row { border-bottom: 1px solid #eee; padding: 6px 0; }
      .row.parked { opacity: 0.88; }
      .line1 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      .acts { display: flex; align-items: center; gap: 4px; flex: 0 0 auto; }
      .line1 .url { color: #b45309; font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; }
      .row.focused .url { color: #15803d; }
      .row.manual .url { color: #7c3aed; }
      .line1 button, button.mini { width: auto; margin: 0; padding: 1px 6px; font-size: 10px; }
      .line2, .line3 { color: #666; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .tag {
        flex: 0 0 auto;
        font-size: 9px;
        text-transform: uppercase;
        padding: 1px 5px;
        border-radius: 3px;
        background: #eee;
      }
    </style>
  </head>
  <body>
    <strong>JOB SCANNER + BIDER</strong>
    <label class="toggle">
      <input type="checkbox" id="scanEnabled" />
      Enable scan
    </label>
    <label class="toggle">
      <input type="checkbox" id="applyEnabled" />
      Enable apply (Bider)
    </label>
    <p class="hint">Search profile: scan on, apply off. Apply profile: scan off, apply on. Set your name in Options once per Chrome profile; dashboard rows show it as queued / ready / skipped and reset at midnight Japan time.</p>
    <div class="meta" id="profileLine">Name · …</div>
    <div id="status">…</div>
    <div id="slotList"></div>
    <div class="scan" id="scanStatus"></div>
    <button id="start">START</button>
    <button id="pause">PAUSE</button>
    <button id="resume">RESUME</button>
    <button id="open">OPEN JOB</button>
    <button id="skip">SKIP</button>
    <button id="next">NEXT JOB</button>
    <button id="prepare">PREPARE PAGE</button>
    <button id="options">OPTIONS / CONNECTION</button>
    <h2>FROM DATABASE</h2>
    <div id="jobs" class="empty">Loading…</div>
    <script src="../shared/dates.js"></script>
    <script src="../shared/verify.js"></script>
    <script src="../shared/job-card.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
